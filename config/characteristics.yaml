Chaos vs Order:
  Chaos:
    - "This was completely random and unpredictable."
    - "There was no structure, just pure anarchy."
  Order:
    - "Everything went exactly according to plan."
    - "The entire process was well structured and predictable."
Aggressive vs Passive:
  Aggressive:
    - "They attacked without any hesitation or warning."
    - "The approach was highly hostile and forceful."
  Passive:
    - "They avoided conflict and stayed back."
    - "The approach was defensive, yielding space without resistance."
Abstract vs Concrete:
  Abstract:
    - "The concepts discussed highly theoretical and philosophical ideas."
    - "It focused on high-level themes, meanings, and structural dynamics."
  Concrete:
    - "It detailed specific physical actions, mechanics, and exact outcomes."
    - "The events were described with precise factual and literal details."
