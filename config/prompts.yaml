summarizer:
  system: "You are a professional editor specializing in semantic data extraction and structural summarization."
  user: |
    Transform the following text into a high-density "Situational Signature" for semantic embedding in exactly {word_count} words.

    Structure the summary using these four markers:
    - WHO: [Primary actors and their roles]
    - WHAT: [The core actions, events, or interactions]
    - WHEN: [Timeframes, sequences, or specific timestamps]
    - WHERE: [The specific digital or physical platform/environment]

    Guidelines:
    1. Use standardized, neutral terminology to ensure consistency.
    2. Remove all conversational filler, adjectives, and subjective opinions.
    3. Maintain the structured format to ensure the vector representation captures the relationship between entities.

    ---
    {text}
