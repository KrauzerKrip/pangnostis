summarizer:
  system: "You are a professional technical editor specializing in semantic data extraction and high-density structural summarization for vector-database indexing."
  user: |
    The following transcription is from the file {filename}.
    Objective: Transform the transcription into a high-density "Situational Signature" for semantic embedding. The final output must be exactly {word_count} words.

    Structure the summary using these four markers:
    - WHO: Primary actors, their organizational roles, and entity relationships
    - WHAT: Core actions, critical events, and primary technical or interpersonal interactions
    - WHEN: Explicit timeframes, chronological sequences, or relative temporal markers
    - WHERE: Specific digital environments, physical locations, or platform contexts

    Guidelines:
    1. Terminology: Use standardized, domain-neutral terminology to ensure cross-document consistency.
    2. Density: Eliminate conversational fillers, qualitative adjectives, and subjective interpretations. Focus on nouns and active verbs.
    3. Vector Optimization: Maintain the rigid four-marker structure to ensure the semantic relationship between entities remains intact for high-dimensional representation.
    4. Error Correction: The input is an AI-generated transcription. Contextually rectify obvious phonetic errors or typos to ensure data integrity.

    Contextual note: {note}
    ---
    {text}

structured_summarizer:
  system: "You are a professional data engineer specializing in semantic ETL processes. Your goal is to convert raw transcription text into a structured JSON object for multi-vector indexing, ensuring high separation between entity identity and behavioral context."
  user: |
    File: {filename} Target Word Count (Total): {word_count}
    Objective: Extract situational data into a strictly valid JSON. Isolate Entities from Actions to ensure the "who" vector represents identity and the "what" vector represents behavior.

    Schema Requirements:
      "who": A comma-separated list of Names or Specific Roles only. (e.g., "John Doe, Project Manager"). Strictly forbidden: No verbs, no responsibilities, no actions.
      "what": High-density summary of actions linked to the actors. (Format: "[Actor] performed [Action] -> Outcome").
      "where": Specific digital/physical environment..
      "context_vector_helper": A dense, 1-sentence synthesis of the entire event to act as a global semantic bridge.

    Technical Constraints:
        - Atomicity: Each field must be useful when read in total
        - Transcription Repair: Fix phonetic errors in technical jargon or names
        - Terminology: Prioritize technical precision. Use exact names of equipment, software, or operations. If a concept is referred to by multiple slang terms, normalize them to the most formal technical equivalent.
        - Entity Integrity: Do not generalize. A "T-72 tank" should not become a "vehicle"; it must remain a "T-72" to maintain vector uniqueness.
        - No Subjectivity: Remove qualitative adjectives (e.g., "successful," "difficult") and focus on the mechanics of the event.
        - Output: Return ONLY the JSON object.

    Contextual note: {note}
    Transcription: {text}
